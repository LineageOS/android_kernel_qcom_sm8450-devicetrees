%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/qcom/qcom,soc-util.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. SoC utility driver

maintainers:
  - Koushik Immadisetty <kimmadis@qti.qualcomm.com>

description: |
  Generic SoC utility platform driver that provides a stable
  sysfs class interface between userspace and kernel subsystems.

properties:
  compatible:
    const: qcom,soc-util

  nvmem-cells:
    description: phandle to the nvmem cell to be accessed

  nvmem-cell-names:
    description: name of the nvmem cell referenced above
    const: logo-orientation

required:
  - compatible
  - nvmem-cells
  - nvmem-cell-names

additionalProperties: false

examples:
  - |
    soc-util {
        compatible = "qcom,soc-util";
        nvmem-cells = <&logo_orientation>;
        nvmem-cell-names = "logo-orientation";
    };